<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | FreshMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-family: inherit;
        }

        .order-summary {
            background: var(--background);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 1.25rem;
            margin-top: 1rem;
        }

        .place-order-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            transition: background 0.2s;
        }

        .place-order-btn:hover {
            background: var(--primary-dark);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--text-light);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Success Modal */
        .success-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 400px;
            width: 90%;
        }

        .success-modal.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: all;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: #d1fae5;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .success-modal h2 {
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .success-modal p {
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .continue-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        .overlay-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }

        .overlay-bg.active {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="logo">FreshMarket</div>
        </header>

        <div class="checkout-container">
            <div class="checkout-header">
                <h1>Checkout</h1>
                <p>Complete your order</p>
            </div>

            <div class="checkout-grid">
                <div class="checkout-form">
                    <h3>Shipping Details</h3>
                    <br>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address" placeholder="123 Street Name" required>
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city" placeholder="New York" required>
                    </div>
                </div>

                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <br>
                    <div id="summary-items">
                        <!-- Items injected here -->
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="summary-total">₹0.00</span>
                    </div>
                </div>
            </div>

            <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
            <a href="index.html" class="back-link">← Continue Shopping</a>
        </div>

        <div class="overlay-bg" id="modal-overlay"></div>
        <div class="success-modal" id="success-modal">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h2>Order Placed!</h2>
            <p>Thank you for your purchase. Your order <span id="order-id"
                    style="font-weight: 600; color: var(--text)">#</span> has been received.</p>
            <button class="continue-btn" onclick="finishOrder()">Continue Shopping</button>
        </div>
    </div>
    <script>
        const API_URL = '/api';
        let cart = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });

        function loadCart() {
            const storedCart = localStorage.getItem('freshmarket_cart');

            if (storedCart) {
                cart = JSON.parse(storedCart);
                renderSummary();
            } else {
                window.location.href = 'index.html';
            }
        }

        function renderSummary() {
            const container = document.getElementById('summary-items');
            const totalEl = document.getElementById('summary-total');

            if (cart.length === 0) {
                container.innerHTML = '<div>Cart is empty</div>';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="summary-item">
                    <div>
                        <div style="font-weight: 500">${item.product.name}</div>
                        <div style="font-size: 0.9rem; color: var(--text-light)">Qty: ${item.quantity}</div>
                    </div>
                    <div>₹${(item.product.price * item.quantity).toFixed(2)}</div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            totalEl.textContent = `₹${total.toFixed(2)}`;
        }

        async function placeOrder() {
            const name = document.getElementById('name').value;
            const address = document.getElementById('address').value;

            if (!name || !address) {
                alert('Please fill in your name and address.');
                return;
            }

            const order = {
                customerName: name,
                customerAddress: address,
                totalAmount: cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0),
                items: cart.map(item => ({
                    productId: item.product.id,
                    productName: item.product.name,
                    price: item.product.price,
                    quantity: item.quantity
                }))
            };

            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(order)
                });

                if (response.ok) {
                    const savedOrder = await response.json();
                    showSuccessModal(savedOrder.id);
                } else {
                    throw new Error('Failed to place order');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to place order.');
            }
        }

        function showSuccessModal(orderId) {
            document.getElementById('order-id').textContent = `#${orderId}`;
            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('success-modal').classList.add('active');
        }

        function finishOrder() {
            localStorage.removeItem('freshmarket_cart');
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
