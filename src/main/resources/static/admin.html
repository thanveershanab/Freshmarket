<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FreshMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .orders-card {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #f9fafb;
            padding: 1rem;
            font-weight: 600;
            color: var(--text-light);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #f3f4f6;
            color: var(--text);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            background: #d1fae5;
            color: var(--primary-dark);
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .price-col {
            font-weight: 600;
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="logo">FreshMarket <span
                    style="font-size: 0.8rem; background: var(--primary); color: white; padding: 2px 8px; border-radius: 4px; vertical-align: middle; margin-left: 8px;">ADMIN</span>
            </div>
            <a href="/logout" class="logout-btn">Logout</a>
        </header>

        <div class="admin-container">
            <div class="dashboard-header">
                <h1>Customer Orders</h1>
                <p>Overview of all orders placed.</p>
            </div>

            <div class="orders-card">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Address</th>
                            <th>Items</th>
                            <th>Total Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table">
                        <!-- Orders injected here -->
                    </tbody>
                </table>
            </div>
            <p id="loading-msg" style="text-align: center; margin-top: 2rem; color: var(--text-light);">Loading
                orders...</p>
        </div>
    </div>

    <script>
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');

                if (response.status === 403 || response.status === 401) {
                    alert('Unauthorized. Redirecting to login.');
                    window.location.href = '/login.html';
                    return;
                }

                const orders = await response.json();
                renderOrders(orders);
                document.getElementById('loading-msg').style.display = 'none';
            } catch (error) {
                console.error('Failed to fetch orders:', error);
                document.getElementById('loading-msg').textContent = 'Failed to load orders.';
            }
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('orders-table');

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No orders found.</td></tr>';
                return;
            }

            tbody.innerHTML = orders.map(order => `
                <tr>
                    <td style="font-weight: 600;">#${order.id}</td>
                    <td>${order.customerName}<br><span style="font-size: 0.8rem; color: var(--text-light)">Via Web</span></td>
                    <td>${order.customerAddress}</td>
                    <td>
                        <ul style="list-style: none; font-size: 0.9rem;">
                            ${order.items.map(item => `
                                <li>${item.quantity}x ${item.productName}</li>
                            `).join('')}
                        </ul>
                    </td>
                    <td class="price-col">₹${order.totalAmount.toFixed(2)}</td>
                    <td><span class="status-badge">Placed</span></td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>

</html>
